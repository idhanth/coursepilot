# Render Blueprint for the CoursePilot API (FastAPI). The frontend is deployed on Vercel and the
# PostgreSQL database is hosted on Neon, so this file only describes the API web service.
# Values marked "sync: false" are secrets: Render asks for them when the Blueprint is created.
services:
  - type: web
    name: coursepilot-api
    runtime: python
    plan: free
    rootDir: backend # Python version comes from backend/.python-version
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
